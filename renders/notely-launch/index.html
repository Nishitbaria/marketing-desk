<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ground: #1b1f3b;
        --paper: #f4efe6;
        --ember: #ff6b4a;
        --mist: #8a8fa8;
        --panel: #262b4d;
        --display: "Space Grotesk", sans-serif;
        --body: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { position: relative; width: 100%; height: 100%; color: var(--paper); font-family: var(--display); }
      .scene { position: absolute; inset: 0; width: 1920px; height: 1080px; background: var(--ground); }
      .ember { color: var(--ember); }

      #tabs { position: absolute; top: 96px; left: 120px; display: flex; gap: 12px; }
      .tab { width: 128px; height: 56px; border-radius: 14px 14px 0 0; background: var(--panel); border-bottom: 4px solid var(--mist); }
      #hook-text { position: absolute; left: 120px; top: 340px; font-size: 148px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; }
      #hook-text span { display: block; }

      #problem-list { position: absolute; left: 120px; top: 270px; font-size: 104px; font-weight: 700; line-height: 1.5; letter-spacing: -0.02em; }
      #problem-list div { white-space: nowrap; }
      .scrap { position: absolute; width: 240px; height: 160px; border-radius: 16px; background: var(--panel); border: 2px solid var(--mist); }
      .scrap i { display: block; height: 12px; margin: 28px 28px 0; border-radius: 6px; background: var(--mist); }
      #s1 { left: 1230px; top: 170px; } #s2 { left: 1540px; top: 360px; } #s3 { left: 1160px; top: 520px; }
      #s4 { left: 1490px; top: 740px; } #s5 { left: 1250px; top: 800px; }

      #solution-list { position: absolute; left: 120px; top: 230px; font-size: 96px; font-weight: 700; line-height: 1.26; letter-spacing: -0.02em; }
      #solution-list div { white-space: nowrap; }
      #panel { position: absolute; left: 1060px; top: 190px; width: 740px; height: 700px; padding: 56px; border-radius: 32px; background: var(--panel); box-shadow: 0 40px 90px rgba(0, 0, 0, 0.35); }
      #panel h2 { font-size: 64px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 44px; }
      .row { height: 136px; margin-top: 24px; padding: 0 40px; display: flex; align-items: center; border-radius: 18px; background: var(--ground); font-family: var(--body); font-size: 48px; font-weight: 500; }

      #cta { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      #cta-line { font-size: 176px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
      #cta-url { margin-top: 48px; font-family: var(--body); font-size: 48px; font-weight: 500; color: var(--mist); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <section id="hook" class="clip scene" data-start="0" data-duration="3" data-track-index="0">
        <div id="tabs">
          <div class="tab"></div><div class="tab"></div><div class="tab"></div><div class="tab"></div>
          <div class="tab"></div><div class="tab"></div><div class="tab"></div><div class="tab"></div>
          <div class="tab"></div><div class="tab"></div><div class="tab"></div><div class="tab"></div>
        </div>
        <h1 id="hook-text"><span id="h1">Your best ideas die in</span><span id="h2" class="ember">12 open tabs.</span></h1>
      </section>

      <section id="problem" class="clip scene" data-start="3" data-duration="7" data-track-index="0">
        <div class="scrap" id="s1"><i></i><i></i></div>
        <div class="scrap" id="s2"><i></i><i></i></div>
        <div class="scrap" id="s3"><i></i><i></i></div>
        <div class="scrap" id="s4"><i></i><i></i></div>
        <div class="scrap" id="s5"><i></i><i></i></div>
        <div id="problem-list">
          <div id="p1">scattered notes,</div>
          <div id="p2">lost links,</div>
          <div id="p3" class="ember">context switching.</div>
        </div>
      </section>

      <section id="solution" class="clip scene" data-start="10" data-duration="12" data-track-index="0">
        <div id="solution-list">
          <div id="l0">Notely captures</div>
          <div id="l1">ideas,</div>
          <div id="l2">code snippets</div>
          <div id="l3">and links</div>
          <div id="l4" class="ember">in one place.</div>
        </div>
        <div id="panel">
          <h2>Notely</h2>
          <div class="row" id="r1">ideas</div>
          <div class="row" id="r2">code snippets</div>
          <div class="row" id="r3">links</div>
        </div>
      </section>

      <section id="cta" class="clip scene" data-start="22" data-duration="8" data-track-index="0">
        <div id="cta-line" class="ember" data-hold>Try Notely free.</div>
        <div id="cta-url">[placeholder URL]</div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const land = { opacity: 0, y: 36 };
      const landed = { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" };

      tl.fromTo(".tab", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, stagger: 0.08, ease: "power2.out" }, 0.05);
      tl.fromTo("#h2", land, landed, 1.1);

      tl.fromTo(".scrap", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.7, stagger: 0.15, ease: "power2.out" }, 3.1);
      tl.to("#s1", { x: -70, y: -50, rotation: -8, duration: 6.8, ease: "none" }, 3.2);
      tl.to("#s2", { x: 90, y: -60, rotation: 7, duration: 6.8, ease: "none" }, 3.2);
      tl.to("#s3", { x: -90, y: 30, rotation: -5, duration: 6.8, ease: "none" }, 3.2);
      tl.to("#s4", { x: 100, y: 70, rotation: 9, duration: 6.8, ease: "none" }, 3.2);
      tl.to("#s5", { x: -50, y: 90, rotation: -10, duration: 6.8, ease: "none" }, 3.2);
      tl.fromTo("#p1", land, landed, 3.3);
      tl.fromTo("#p2", land, landed, 5.2);
      tl.fromTo("#p3", land, landed, 7.1);

      tl.fromTo("#panel", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 10.2);
      tl.to("#panel", { scale: 1.03, duration: 11, ease: "none" }, 11);
      tl.fromTo("#l0", land, landed, 10.3);
      tl.fromTo("#l1", land, landed, 12.2);
      tl.fromTo("#r1", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 12.4);
      tl.fromTo("#l2", land, landed, 14.2);
      tl.fromTo("#r2", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 14.4);
      tl.fromTo("#l3", land, landed, 16.2);
      tl.fromTo("#r3", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 16.4);
      tl.fromTo("#l4", land, landed, 18.2);

      tl.fromTo("#cta-line", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 22.3);
      tl.fromTo("#cta-url", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 23.1);
      tl.to({}, { duration: 0.01 }, 29.99);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
